<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001633" />
      <stop offset="100%" stop-color="#000914" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fe762a" />
      <stop offset="100%" stop-color="#d95106" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- Background rounded squircle with subtle border -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)" />
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="13.25" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />

  <!-- Left building wing -->
  <rect x="13" y="28" width="13" height="23" rx="2.5" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
  <rect x="16.5" y="32" width="2.5" height="3" rx="0.5" fill="#38bdf8" fill-opacity="0.9" />
  <rect x="20.5" y="32" width="2.5" height="3" rx="0.5" fill="#38bdf8" fill-opacity="0.9" />
  <rect x="16.5" y="38" width="2.5" height="3" rx="0.5" fill="#38bdf8" fill-opacity="0.9" />
  <rect x="20.5" y="38" width="2.5" height="3" rx="0.5" fill="#38bdf8" fill-opacity="0.9" />
  <rect x="16.5" y="44" width="2.5" height="3" rx="0.5" fill="#38bdf8" fill-opacity="0.9" />
  <rect x="20.5" y="44" width="2.5" height="3" rx="0.5" fill="#38bdf8" fill-opacity="0.9" />

  <!-- Center Primary High-Rise Tower with spire -->
  <path d="M26 18C26 16.8954 26.8954 16 28 16H36C37.1046 16 38 16.8954 38 18V51H26V18Z" fill="url(#blueGrad)" />
  <line x1="32" y1="9" x2="32" y2="16" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  <circle cx="32" cy="8" r="1.5" fill="#fe762a" />

  <!-- Tower Windows -->
  <rect x="29" y="20" width="2.5" height="3.5" rx="0.5" fill="#ffffff" fill-opacity="0.95" />
  <rect x="33" y="20" width="2.5" height="3.5" rx="0.5" fill="#ffffff" fill-opacity="0.95" />
  <rect x="29" y="26" width="2.5" height="3.5" rx="0.5" fill="#ffffff" fill-opacity="0.95" />
  <rect x="33" y="26" width="2.5" height="3.5" rx="0.5" fill="#ffffff" fill-opacity="0.95" />
  <rect x="29" y="32" width="2.5" height="3.5" rx="0.5" fill="#ffffff" fill-opacity="0.95" />
  <rect x="33" y="32" width="2.5" height="3.5" rx="0.5" fill="#ffffff" fill-opacity="0.95" />
  <rect x="29" y="38" width="2.5" height="3.5" rx="0.5" fill="#ffffff" fill-opacity="0.95" />
  <rect x="33" y="38" width="2.5" height="3.5" rx="0.5" fill="#ffffff" fill-opacity="0.95" />

  <!-- Portal Entrance -->
  <rect x="30" y="45" width="4" height="6" rx="1" fill="#001633" />

  <!-- Right Architectural Wing with Nexus Orange -->
  <rect x="38" y="24" width="13" height="27" rx="2.5" fill="url(#accentGrad)" />
  <rect x="41.5" y="28" width="2.5" height="3" rx="0.5" fill="#ffffff" fill-opacity="0.95" />
  <rect x="45.5" y="28" width="2.5" height="3" rx="0.5" fill="#ffffff" fill-opacity="0.95" />
  <rect x="41.5" y="34" width="2.5" height="3" rx="0.5" fill="#ffffff" fill-opacity="0.95" />
  <rect x="45.5" y="34" width="2.5" height="3" rx="0.5" fill="#ffffff" fill-opacity="0.95" />
  <rect x="41.5" y="40" width="2.5" height="3" rx="0.5" fill="#ffffff" fill-opacity="0.95" />
  <rect x="45.5" y="40" width="2.5" height="3" rx="0.5" fill="#ffffff" fill-opacity="0.95" />

  <!-- Ground foundation line -->
  <line x1="10" y1="51" x2="54" y2="51" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.5" stroke-linecap="round" />
